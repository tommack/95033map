# On every push and pull request: lint, then the tests, which include building the public map from the
# committed data without warnings (e.g. a neighborhood map that's out of date) and checking
# data/slugs.json, which keeps old links working, is up to date.
name: Check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
